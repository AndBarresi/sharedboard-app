name: Publish SharedBoard Bridge
on:
  push:
    tags:
      - 'bridge-v*'
permissions:
  contents: write
jobs:
  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Verify the release tag matches the application version
        shell: pwsh
        env:
          BRIDGE_TAG: ${{ github.ref_name }}
        run: |
          $bridgeVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:BRIDGE_TAG -cne "bridge-v$bridgeVersion") { throw 'The bridge tag must match the version recorded in package.json.' }
      - name: Test bridge protocol and isolated Windows installation
        run: node --test test/bridge-server.test.mjs test/bridge-launcher.test.mjs
      - name: Build the private-data-free Windows companion
        run: node scripts/package-bridge.mjs --output release/SharedBoard-Bridge-windows-x64.zip
      - name: Publish the webpage download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TAG: ${{ github.ref_name }}
        run: |
          @'
          SharedBoard Bridge connects the hosted webpage to an existing local Codex conversation.

          Extract the ZIP and open **Install SharedBoard Bridge.cmd**, then return to https://sharedboard.app and choose **Connect Codex**.

          Boards and mini-chat history stay in your browser. Keep the board tab open during AI interaction. This testing build supports Codex on Windows x64 and includes its Node runtime; it does not include anyone's saved board or connection credentials.

          Created by Andrew Barresi: https://github.com/AndBarresi
          '@ | Set-Content -LiteralPath release/NOTES.md
          gh release create $env:BRIDGE_TAG release/SharedBoard-Bridge-windows-x64.zip release/SharedBoard-Bridge-windows-x64.zip.sha256 --title "SharedBoard Bridge $env:BRIDGE_TAG - Windows testing beta" --notes-file release/NOTES.md --latest
